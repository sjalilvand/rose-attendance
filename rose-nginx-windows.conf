# Rose Attendance — Nginx for Windows (no-Docker deployment), HTTP-only, port 8080.
# این فایل توسط install-rose-prereq.ps1 به C:\rose-stack\nginx\conf\nginx.conf کپی می‌شود.
# سازگار با frontend/nginx-http.conf پروژه — برای SSL بعداً بخش ۸ راهنما را ببینید.

worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # برای WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name _;

        # PWA ساخته‌شده (خروجی npm run build)
        root "C:/rose-attendance/frontend/dist";
        index index.html;

        client_max_body_size 20m;

        # فایل‌های static پنل ادمین جنگو (collectstatic)
        location /static/ {
            alias "C:/rose-attendance/backend/staticfiles/";
        }

        # API
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket اطلاع‌رسانی زنده
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
        }

        # پنل ادمین جنگو (روی HTTP کوکی Secure لاگین نمی‌شود — تا دریافت SSL)
        location /admin/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Service Worker همیشه تازه
        location = /sw.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
