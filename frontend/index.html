<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#96771c" />
    <meta name="description" content="سامانه حضور و غیاب رز سفید — ثبت تردد بدون نیاز به GPS دائمی، با پشتیبانی کامل آفلاین" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />
    <title>رز سفید — حضور و غیاب</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ورود یکپارچه (SSO) با رز هاب: توکن یک‌بارمصرف در URL را قبل از بوت
      // برنامه به بک‌اند می‌فرستیم، جفت‌توکن نشست را در localStorage می‌گذاریم
      // و پارامتر sso_token را از نشانی پاک می‌کنیم.
      (function () {
        try {
          var q = new URLSearchParams(window.location.search);
          var t = q.get('sso_token');
          if (!t) return;
          fetch('/api/v1/auth/rose-sso/?sso_token=' + encodeURIComponent(t), {
            headers: { Accept: 'application/json' },
          })
            .then(function (r) {
              if (!r.ok) throw new Error('sso failed');
              return r.json();
            })
            .then(function (data) {
              localStorage.setItem('rose.access', data.access);
              localStorage.setItem('rose.refresh', data.refresh);
              window.location.replace('/');
            })
            .catch(function () {
              window.location.replace('/?sso_error=1');
            });
        } catch (e) {}
      })();
    </script>
    <noscript>برای استفاده از سامانه رز سفید، جاوااسکریپت را فعال کنید.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
